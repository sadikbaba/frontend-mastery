<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Weather App</title>
  </head>
  <body>
    <!-- 
     1 cointianer 
     2 form
     3 header 
     3 input
     4 button
     5 result 
     -->

    <div class="container">
      <form action="#" id="weather-form">
        <fieldset>
          <legend>Weather App</legend>

          <input
            type="text"
            id="wether-id"
            name="wether-id"
            placeholder="Enter City Name"
          />
        </fieldset>
        <button id="btn" type="submit">Get Weather</button>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
