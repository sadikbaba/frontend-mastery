<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Tangerine"
    />
    <meta
      name="description"
      content="Search GitHub users and explore country information based on their profile location."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>GitHub + Country Explorer</title>
  </head>
  <body>
    <!--
    1 top logo and about
    2 search bar in the form 
    3 search button
    4 clear button 
    5 show results
      -1 container user of retuslts
        -i avatar conatiner
        -ii container of info 
      -2 contry container
    -->

    <!-- 1 header = top logo and about -->

    <header>
      <h1>GitHub + Country Explorer</h1>
      <button id="about" aria-label="About">i</button>
    </header>

    <!-- 2 search bar in the form -->
    <main>
      <form action="#" id="search-form">
        <input
          type="text"
          id="search-input"
          aria-label="GitHub username"
          placeholder="Enter GitHub username (e.g., sadikbaba)"
          required
        />
        <!-- 3 search button -->
        <button type="submit" id="search-btn">Search</button>
        <!-- 4 clear button -->
        <button type="button" id="clear-btn">Clear</button>
      </form>

      <!-- 5 show results -->

      <section id="results" hidden>
        <!-- 5.1 container user of retuslts -->
        <p id="status"></p>

        <article id="user-results">
          <div id="avatar-container-bio">
            <img src="" alt="Avatar" id="avatar" />

            <div id="bio-container">
              <h3 id="username"></h3>
              <p id="name"></p>
              <p id="bio"></p>
            </div>
          </div>

          <div id="repo">
            <p id="repositories"></p>
            <p id="followers"></p>
            <p id="following"></p>
          </div>
          <div id="location">
            <p id="p-location"></p>
          </div>
        </article>

        <!-- 5.2 contry container -->
        <div id="country-results">
          <p id="country"></p>
          <p id="capital-city"></p>
          <p id="population"></p>
          <p id="region"></p>
        </div>
      </section>
    </main>

    <footer>
      <p>
        Created by
        <a class="link" href="https://github.com/sadikbaba">Sadik Baba</a> |
        GitHub + Country Explore &copy; 2026
      </p>
    </footer>

    <script src="api.js"></script>
    <script src="dom.js"></script>
  </body>
</html>
